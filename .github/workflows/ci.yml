name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '26'

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    services:
      # `next build` prerenders the cached components, which read the database.
      # A standalone mongod is enough here: the build only reads, and
      # transactions (which need a replica set) are exercised by the adapter
      # suite via Testcontainers.
      mongo:
        image: mongo:8
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      # Hoisted to job scope so the Sonar step's `if:` can read it. A secret
      # referenced only inside a step is not visible to that step's condition.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Sonar needs history to identify new code

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Each step is its own gate so a red build names what broke.
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Hexagon boundaries
        run: pnpm boundaries

      - name: Tests + coverage floors
        run: pnpm test

      # Its own gate. `tsc --noEmit` passing is not evidence the app builds:
      # this step caught three prerender defects that typecheck and unit tests
      # both missed. See ADR-0008.
      - name: Build
        run: pnpm build
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/kurasikapa_ci
          MONGODB_DB: kurasikapa_ci
          # Composition env validation (apps/web/src/composition/env.ts) runs at
          # prerender; this only signs nothing — the build never serves a request.
          BETTER_AUTH_SECRET: ci-build-secret-not-a-real-credential-0123456789

      - name: Install Playwright browser
        run: pnpm --filter @kurasikapa/web exec playwright install chromium --with-deps

      # Runs against the production build above. Cache Components, PPR and
      # Server Action serialisation all behave differently under `next dev`,
      # so a journey that only passes there proves the dev server works.
      - name: E2E journeys + accessibility
        run: pnpm --filter @kurasikapa/web test:e2e
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/kurasikapa_e2e
          MONGODB_DB: kurasikapa_e2e

      - name: Duplication
        run: pnpm dup

      - name: Dependency audit
        run: pnpm audit --audit-level=high

      # Dormant until an instance exists — see docs/07-quality-gates.md § 5.
      - name: SonarQube
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v6

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    services:
      # Same reasoning as the quality job: the build prerenders against the
      # database, and the seeded article has to exist BEFORE that build or the
      # homepage audits an empty site.
      mongo:
        image: mongo:8
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/kurasikapa_lighthouse
      MONGODB_DB: kurasikapa_lighthouse
      # Same rationale as the quality job's build secret — 32 chars is the
      # validator's floor, and this value signs nothing.
      BETTER_AUTH_SECRET: ci-lighthouse-secret-not-a-real-credential-012
      APP_URL: http://127.0.0.1:31923
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The same fixtures the journeys use (e2e/prebuild-seed.ts explains why
      # the seed must precede the build): without them the article URL audits
      # a not-found page and the homepage renders "Nothing published yet".
      - name: Seed the audit fixtures
        run: node e2e/prebuild-seed.ts
        working-directory: apps/web

      - name: Build
        run: pnpm build

      # Assertions live in .github/lighthouse/lighthouserc.json. Performance is
      # warn-level: LCP/INP are field targets (docs/02-prd.md § 8), and a lab
      # score on a cold CI box is a proxy — failing a PR on it would train
      # people to ignore the job. Accessibility is error-level because the axe
      # sweep (same axe-core engine) already passes clean on these pages.
      - name: Audit the homepage and one article
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./.github/lighthouse/lighthouserc.json
          uploadArtifacts: true

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  go:
    name: Go service
    runs-on: ubuntu-latest
    services:
      # The adapter suite runs against a real MongoDB (make integration), the
      # same way the TS adapters use Testcontainers. Standalone is enough:
      # nothing here opens a transaction.
      mongo:
        image: mongo:8
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache-dependency-path: services/api/go.sum
      - name: Verify
        run: make verify
        working-directory: services/api
      - name: Integration tests against a real MongoDB
        run: make integration
        working-directory: services/api
        env:
          # KURA_REQUIRE_MONGO (set by the target) makes a missing service a
          # failure, never a silent skip.
          KURA_TEST_MONGO_URI: mongodb://127.0.0.1:27017/?directConnection=true
      - name: Vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
        working-directory: services/api
