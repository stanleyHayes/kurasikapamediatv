name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '26'

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    env:
      # Hoisted to job scope so the Sonar step's `if:` can read it. A secret
      # referenced only inside a step is not visible to that step's condition.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Sonar needs history to identify new code

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Each step is its own gate so a red build names what broke.
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Hexagon boundaries
        run: pnpm boundaries

      - name: Tests + coverage floors
        run: pnpm test

      - name: Duplication
        run: pnpm dup

      - name: Dependency audit
        run: pnpm audit --audit-level=high

      # Dormant until an instance exists — see docs/07-quality-gates.md § 5.
      - name: SonarQube
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v6

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  go:
    name: Go service
    runs-on: ubuntu-latest
    if: ${{ hashFiles('services/media-svc/go.mod') != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache-dependency-path: services/media-svc/go.sum
      - name: Vet
        run: go vet ./...
        working-directory: services/media-svc
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          working-directory: services/media-svc
      - name: Test
        run: go test -race -coverprofile=coverage.out ./...
        working-directory: services/media-svc
      - name: Vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
        working-directory: services/media-svc
