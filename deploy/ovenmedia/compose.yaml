services:
  ovenmedia:
    image: ovenmedialabs/ovenmediaengine:v0.20.5
    restart: unless-stopped
    environment:
      OME_HOST_IP: ${OME_HOST_IP}
      OME_API_TOKEN: ${OVENMEDIA_API_TOKEN}
      OME_SIGNING_SECRET: ${OVENMEDIA_SIGNING_SECRET}
    ports:
      - "1935:1935/tcp"
    expose:
      - "3333"
      - "8081"
    volumes:
      - ./origin_conf:/opt/ovenmediaengine/bin/origin_conf:ro
      - recordings:/var/lib/kurasikapa/recordings
    networks: [media]

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      LIVE_ORIGIN_DOMAIN: ${LIVE_ORIGIN_DOMAIN}
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [media]

networks:
  media:

volumes:
  recordings:
  caddy_data:
  caddy_config:
