packages:
  - 'apps/*'
  - 'packages/*'

# --- Supply-chain hardening (see docs/07-quality-gates.md § 6) ---

# Wait 7 days before installing a newly published version. A compromised
# release is usually pulled well inside that window.
minimumReleaseAge: 10080

# Exceptions to the wait. Each entry is a decision, not a convenience:
#
#   nanoid — GHSA-2v37-7h3g-55p8 has no fix outside 3.3.18, which is one day
#   short of the window, and CI fails the audit gate until we take it. A
#   patch-line security fix from the same maintainer is exactly the release
#   the wait costs more than it buys. Revisit: drop this entry once 3.3.18
#   would pass unaided (2026-08-15).
minimumReleaseAgeExclude:
  - nanoid

# Refuse transitive dependencies resolved from git/http/tarball sources.
blockExoticSubdeps: true

# A package update may never downgrade our security settings.
trustPolicy: no-downgrade

# Only these packages may run install scripts. Anything else is blocked.
onlyBuiltDependencies:
  - '@tailwindcss/oxide'
  - esbuild
  - sharp

# --- Version pins (ADR-0007) ---
# pnpm 11 reads overrides here, not from package.json.
# Do not raise either of these without re-checking the peer range that caused it.
overrides:
  # typescript-eslint@8 peers "<6.1.0" — TS 7 would disable type-aware linting.
  typescript: 5.9.3
  # @auth/mongodb-adapter@3 peers "^6" — driver v7 breaks Auth.js.
  mongodb: 6.21.0
  # Security overrides (CI runs pnpm audit --audit-level=high).
  #
  # next@16.2.12 declares optional sharp "^0.34.5"; 0.34.x carries high-severity
  # libvips CVEs (GHSA-f88m-g3jw-g9cj). sharp is loaded lazily by next/image
  # through a stable API, and 0.35.0 is the patched line Next itself moved to.
  sharp: 0.35.0
  # next@16.2.12 bundles postcss 8.4.31; high-severity sourceMappingURL reads
  # (GHSA-6g55-p6wh-862q, GHSA-r28c-9q8g-f849) are fixed in the 8.5 line.
  postcss: 8.5.25
  # GHSA-2v37-7h3g-55p8 (infinite loop on zero size); inside the ^3.3.x range
  # postcss already declares. Fast-tracked one day ahead of minimumReleaseAge —
  # see minimumReleaseAgeExclude above.
  nanoid: 3.3.18

# Install scripts are denied by default; each exception is a decision.
#
#   sharp             ALLOW — next/image optimisation genuinely needs its
#                     native binary in production. Images are the bulk of a
#                     media site's bytes, so this one earns its keep.
#   @swc/core         DENY  — Next ships its own @next/swc-* platform binaries.
#   @parcel/watcher   DENY  — dev-only file watching, has a JS fallback.
#   ssh2, cpu-features DENY — testcontainers reaches Docker over the local
#                     socket, so the SSH transport is never exercised.
#   protobufjs        DENY  — its postinstall only regenerates types we do not
#                     consume.
allowBuilds:
  '@parcel/watcher': false
  '@swc/core': false
  cpu-features: false
  protobufjs: false
  sharp: true
  ssh2: false
