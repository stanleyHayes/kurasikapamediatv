# Render blueprint for the Go API.
# Deploys services/api as a Docker web service. Secrets (MONGODB_URI,
# CRON_SECRET) are set in the Render dashboard after the first deploy.

services:
  - type: web
    name: kurasikapa-media-api
    runtime: docker
    dockerfilePath: services/api/Dockerfile
    dockerContext: services/api
    plan: starter
    region: frankfurt
    healthCheckPath: /healthz
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: kurasikapa
      - key: CRON_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_POLLY_REGION
        value: eu-west-2
      - key: AWS_POLLY_OUTPUT_BUCKET
        sync: false
      - key: AWS_IVS_REGION
        value: eu-west-1
      - key: AWS_IVS_RECORDING_BUCKET
        sync: false
      - key: AWS_MEDIACONVERT_OUTPUT_BUCKET
        sync: false
      - key: AWS_MEDIACONVERT_ROLE_ARN
        sync: false
      - key: AWS_MEDIACONVERT_JOB_TEMPLATE
        sync: false
      - key: IVS_RECORDING_WEBHOOK_SECRET
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: VOYAGE_API_KEY
        sync: false
      - key: VOYAGE_MODEL
        value: voyage-4
      - key: VOYAGE_DIMENSIONS
        value: "1024"
