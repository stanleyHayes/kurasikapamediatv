# Render blueprint for the Go API.
# Deploys services/api as a Docker web service. Secrets (MONGODB_URI,
# CRON_SECRET) are set in the Render dashboard after the first deploy.

services:
  - type: web
    name: kurasikapa-media-api
    runtime: docker
    dockerfilePath: services/api/Dockerfile
    dockerContext: services/api
    plan: starter
    region: frankfurt
    healthCheckPath: /healthz
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: kurasikapa
      - key: CRON_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
