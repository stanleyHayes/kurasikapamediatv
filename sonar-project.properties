# SonarQube / SonarCloud configuration.
#
# Dormant by design: the CI step that runs the scanner is conditional on
# SONAR_TOKEN existing. Until an instance is available the same rules are
# enforced locally by ESLint, dependency-cruiser, Vitest and jscpd — see
# docs/07-quality-gates.md. Sonar adds reporting, not new rules.

sonar.projectKey=kurasikapa-media
sonar.projectName=Kurasikapa Media TV
sonar.projectVersion=0.1.0

sonar.sources=packages,apps,services
sonar.tests=packages,apps
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts,**/testing/**
sonar.exclusions=**/node_modules/**,**/dist/**,**/.next/**,**/coverage/**,stitch_kurasikapa_ai_media_platform/**

sonar.javascript.lcov.reportPaths=packages/domain/coverage/lcov.info,packages/application/coverage/lcov.info,apps/web/coverage/lcov.info
sonar.go.coverage.reportPaths=services/media-svc/coverage.out

sonar.sourceEncoding=UTF-8

# Quality gate thresholds — must match docs/07-quality-gates.md
sonar.qualitygate.wait=true
sonar.coverage.newCode.minimum=80
sonar.duplicated_lines_density.maximum=3
